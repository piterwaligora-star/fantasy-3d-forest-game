<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy 3D Pixel Forest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
            z-index: 10;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 12px;
            text-shadow: 0 0 10px #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00ff00;
        }
        
        .stat {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>⚔️ Fantasy 3D Forest ⚔️</h1>
        <div class="stat">Position: <span id="pos">0, 0, 0</span></div>
        <div class="stat">FPS: <span id="fps">60</span></div>
    </div>
    
    <div id="controls">
        <div><strong>🎮 Controls</strong></div>
        <div>W/A/S/D - Move</div>
        <div>Mouse - Look Around</div>
        <div>Space - Jump</div>
        <div>M - Toggle Music</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
